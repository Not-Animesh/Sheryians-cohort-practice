<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>JavaScript This</title>

  <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="min-h-screen bg-[#0a0a0a] text-white flex items-center justify-center p-6">

  <main class="w-full max-w-xl">

    <h1 class="text-3xl font-bold text-center mb-2">
      JavaScript <span class="text-gray-400">this</span>
    </h1>

    <p class="text-center text-gray-500 mb-8">
      See how <code>this</code> changes in different situations
    </p>


    <div class="bg-[#151515] border border-[#292929] rounded-xl p-5">

      <h2 class="text-xl font-semibold mb-4">
        Check Console
      </h2>

      <p class="text-gray-400 text-sm mb-5">
        Open DevTools → Console to see what
        <code>this</code> refers to.
      </p>


      <button
        id="testBtn"
        class="bg-white text-black px-5 py-2 rounded-lg"
      >
        Test Event Handler
      </button>

    </div>

  </main>


  <script src="script.js"></script>

</body>
</html>
